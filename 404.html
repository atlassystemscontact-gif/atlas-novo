<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#eeeeec">
    <title>Página não encontrada — Atlas Systems</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face{font-family:Inter;src:url('/assets/fonts/inter-latin.woff2') format('woff2');font-display:swap}
      @font-face{font-family:'Inter Tight';src:url('/assets/fonts/inter-tight-latin.woff2') format('woff2');font-display:swap}
      :root{--paper:#eeeeec;--ink:#050505;--acid:#d5f74c;--line:rgba(5,5,5,.14);--header:96px}
      *,*::before,*::after{box-sizing:border-box}
      html{background:var(--paper)}
      body{min-height:100svh;margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);font-family:Inter,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
      a{color:inherit;text-decoration:none}
      button{border:0;color:inherit;font:inherit}
      .site-header{position:relative;z-index:10;height:var(--header);border-bottom:1px solid rgba(255,255,255,.75);background:rgba(238,238,236,.82);backdrop-filter:blur(18px)}
      .header-inner{display:flex;width:min(100% - 64px,1440px);height:100%;align-items:center;justify-content:space-between;margin-inline:auto}
      .brand{display:inline-flex;align-items:center;gap:13px;font-family:'Inter Tight',Arial,sans-serif;font-size:17px;font-weight:700;letter-spacing:-.04em}
      .brand-mark{width:54px;height:54px;flex:0 0 auto;background:var(--ink);clip-path:polygon(42% 0,58% 0,61% 34%,85% 10%,96% 22%,71% 44%,100% 47%,99% 64%,67% 62%,88% 89%,75% 100%,56% 72%,53% 100%,36% 99%,39% 67%,11% 87%,0 73%,29% 55%,0 51%,3% 35%,35% 40%);transition:transform .7s cubic-bezier(.2,.8,.2,1)}
      .brand:hover .brand-mark{transform:rotate(120deg)}
      .header-actions{display:flex;align-items:center;gap:10px}
      .portfolio-link{display:inline-flex;min-height:48px;align-items:center;padding:0 28px;border-radius:999px;background:var(--acid);font-size:13px;font-weight:700}
      .language-toggle{display:inline-flex;width:62px;height:48px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer;font-size:11px;font-weight:700}
      .error-page{position:relative;display:grid;min-height:calc(100svh - var(--header));grid-template-columns:minmax(0,1.12fr) minmax(360px,.88fr);overflow:hidden}
      .error-copy{display:flex;min-height:calc(100svh - var(--header));flex-direction:column;justify-content:space-between;padding:clamp(34px,5vw,78px) clamp(26px,6vw,96px) 44px}
      .eyebrow{display:flex;align-items:center;gap:9px;margin:0;font-size:12px;font-weight:700}
      .eyebrow::before{content:'✦';font-size:12px}
      .error-number{margin:auto 0 0;font-family:'Inter Tight',Arial,sans-serif;font-size:clamp(150px,27vw,410px);font-weight:650;letter-spacing:-.105em;line-height:.66;transform:translateX(-.055em)}
      .error-message{display:grid;max-width:740px;grid-template-columns:minmax(0,1fr) minmax(250px,.58fr);gap:38px;align-items:end;margin-top:clamp(45px,7vh,90px)}
      .error-message h1{margin:0;font-family:'Inter Tight',Arial,sans-serif;font-size:clamp(42px,5vw,76px);font-weight:650;letter-spacing:-.065em;line-height:.92}
      .error-message p{margin:0;color:#666;font-size:14px;line-height:1.55}
      .error-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
      .button{display:inline-flex;min-height:48px;align-items:center;justify-content:center;gap:9px;padding:0 24px;border-radius:999px;font-size:13px;font-weight:700;transition:transform .25s ease,background-color .25s ease,color .25s ease}
      .button:hover{transform:translateY(-2px)}
      .button-primary{background:var(--ink);color:#fff}
      .button-primary:hover{background:var(--acid);color:var(--ink)}
      .button-secondary{border:1px solid var(--line);background:rgba(255,255,255,.4)}
      .error-visual{position:relative;min-height:calc(100svh - var(--header));overflow:hidden;border-radius:34px 0 0 34px;background:var(--acid);isolation:isolate}
      .visual-grid{position:absolute;inset:0;opacity:.14;background-image:linear-gradient(var(--ink) 1px,transparent 1px),linear-gradient(90deg,var(--ink) 1px,transparent 1px);background-size:74px 74px;mask-image:linear-gradient(to bottom,#000,transparent 88%)}
      .orbit,.orbit::before,.orbit::after{position:absolute;border:1px solid rgba(5,5,5,.3);border-radius:50%}
      .orbit{top:50%;left:50%;width:min(78vh,720px);aspect-ratio:1;transform:translate(-43%,-50%);animation:orbit 20s linear infinite}
      .orbit::before{inset:13%;content:''}
      .orbit::after{inset:31%;content:''}
      .visual-star{position:absolute;top:50%;left:50%;width:clamp(120px,15vw,220px);aspect-ratio:1;background:var(--ink);clip-path:polygon(42% 0,58% 0,61% 34%,85% 10%,96% 22%,71% 44%,100% 47%,99% 64%,67% 62%,88% 89%,75% 100%,56% 72%,53% 100%,36% 99%,39% 67%,11% 87%,0 73%,29% 55%,0 51%,3% 35%,35% 40%);transform:translate(-35%,-50%);animation:star 9s ease-in-out infinite}
      .visual-label{position:absolute;top:44px;left:44px;margin:0;font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase}
      .visual-code{position:absolute;right:42px;bottom:38px;font-family:'Inter Tight',Arial,sans-serif;font-size:clamp(20px,3vw,42px);font-weight:650;letter-spacing:-.04em}
      .float-token{position:absolute;display:grid;width:58px;height:58px;place-items:center;border:1px solid rgba(5,5,5,.2);border-radius:18px;background:rgba(255,255,255,.32);font-family:'Inter Tight',Arial,sans-serif;font-weight:700;backdrop-filter:blur(8px)}
      .token-a{top:18%;right:14%;animation:float 5s ease-in-out infinite}
      .token-b{right:21%;bottom:17%;animation:float 6s 1s ease-in-out infinite reverse}
      @keyframes orbit{to{transform:translate(-43%,-50%) rotate(360deg)}}
      @keyframes star{0%,100%{transform:translate(-35%,-50%) rotate(0) scale(.94)}50%{transform:translate(-35%,-54%) rotate(70deg) scale(1.05)}}
      @keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-18px) rotate(7deg)}}
      @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
      @media (max-width:820px){
        :root{--header:72px}
        .header-inner{width:calc(100% - 32px)}
        .brand-name{display:none}
        .brand-mark{width:42px;height:42px}
        .portfolio-link{min-height:40px;padding-inline:15px;font-size:10px}
        .language-toggle{width:42px;height:40px;font-size:9px}
        .error-page{display:flex;min-height:calc(100svh - var(--header));flex-direction:column}
        .error-copy{min-height:auto;padding:42px 20px 54px}
        .error-number{margin-top:86px;font-size:clamp(132px,52vw,210px)}
        .error-message{grid-template-columns:1fr;gap:18px;margin-top:58px}
        .error-message h1{font-size:clamp(45px,13vw,58px)}
        .error-message p{max-width:330px;font-size:13px}
        .error-actions{margin-top:24px}
        .button{min-height:46px;padding-inline:20px;font-size:12px}
        .error-visual{min-height:460px;border-radius:28px 28px 0 0}
        .visual-label{top:28px;left:24px}
        .visual-code{right:24px;bottom:28px}
        .orbit{width:430px;transform:translate(-48%,-50%)}
        .visual-star{width:142px;transform:translate(-50%,-50%)}
        .float-token{width:50px;height:50px;border-radius:15px}
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="Atlas Systems — início">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Atlas Systems</span>
        </a>
        <div class="header-actions">
          <a class="portfolio-link" href="https://atlas-portfolio-v2.vercel.app/" target="_blank" rel="noopener noreferrer" data-pt="Portfólio Atlas" data-en="Atlas Portfolio">Portfólio Atlas</a>
          <button class="language-toggle" id="language-toggle" type="button" aria-label="Trocar idioma para inglês">PT / EN</button>
        </div>
      </div>
    </header>
    <main class="error-page">
      <section class="error-copy" aria-labelledby="error-title">
        <p class="eyebrow" data-pt="Rota não encontrada" data-en="Route not found">Rota não encontrada</p>
        <div>
          <p class="error-number" aria-hidden="true">404</p>
          <div class="error-message">
            <h1 id="error-title" data-pt="Essa página saiu da rota." data-en="This page went off route.">Essa página saiu da rota.</h1>
            <div>
              <p data-pt="O endereço pode ter mudado ou não existe mais. Você pode voltar ao início ou conversar diretamente com a Atlas." data-en="The address may have changed or may no longer exist. Return home or talk directly to Atlas.">O endereço pode ter mudado ou não existe mais. Você pode voltar ao início ou conversar diretamente com a Atlas.</p>
              <nav class="error-actions" aria-label="Opções da página não encontrada">
                <a class="button button-primary" href="/"><span data-pt="Voltar ao início" data-en="Back to home">Voltar ao início</span><span aria-hidden="true">&#x2192;&#xFE0E;</span></a>
                <a class="button button-secondary" href="https://wa.me/5511930534679?text=Ol%C3%A1%21%20Cheguei%20a%20uma%20p%C3%A1gina%20n%C3%A3o%20encontrada%20no%20site%20da%20Atlas%20Systems." target="_blank" rel="noopener noreferrer" data-pt="Falar com a Atlas" data-en="Talk to Atlas">Falar com a Atlas</a>
              </nav>
            </div>
          </div>
        </div>
      </section>
      <aside class="error-visual" aria-hidden="true">
        <div class="visual-grid"></div>
        <div class="orbit"></div>
        <div class="visual-star"></div>
        <p class="visual-label" data-pt="Atlas Systems · erro 404" data-en="Atlas Systems · error 404">Atlas Systems · erro 404</p>
        <span class="float-token token-a">{ }</span>
        <span class="float-token token-b">AI</span>
        <span class="visual-code" data-pt="Recalculando rota…" data-en="Recalculating route…">Recalculando rota…</span>
      </aside>
    </main>
    <script>
      (()=>{
        const button=document.getElementById('language-toggle');
        let language='pt';
        button?.addEventListener('click',()=>{
          language=language==='pt'?'en':'pt';
          document.documentElement.lang=language==='pt'?'pt-BR':'en';
          document.querySelectorAll('[data-pt][data-en]').forEach(element=>{element.textContent=element.dataset[language]});
          document.title=language==='pt'?'Página não encontrada — Atlas Systems':'Page not found — Atlas Systems';
          button.setAttribute('aria-label',language==='pt'?'Trocar idioma para inglês':'Switch language to Portuguese');
        });
      })();
    </script>
  </body>
</html>
